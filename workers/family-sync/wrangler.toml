name = "family-sync"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[durable_objects.bindings]]
name = "FAMILY_GROUPS_DO"
class_name = "FamilyGroupDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyGroupDurableObject"]

[vars]
ALLOWED_ORIGINS = "https://shelter-route.pages.dev,http://localhost:5174"

[env.dev.vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:4173,http://127.0.0.1:4174"

[env.production.vars]
ALLOWED_ORIGINS = "https://shelter-route.pages.dev"
